<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .marc-screen { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; }
    .marc-display { font-family: Fraunces, Georgia, 'Times New Roman', serif; }
    a { color: #9FD3B4; } a:hover { color: #FAF9F6; }
  </style>
</helmet>

<div class="marc-screen" style="position:relative; width:1024px; height:500px; background:linear-gradient(120deg,#2F6B4F 0%,#1F3D34 100%); overflow:hidden;">

  <!-- Tekstur organik lembut — elak latar rata kosong -->
  <div style="position:absolute; top:-160px; right:-160px; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle, rgba(159,211,180,0.14) 0%, rgba(159,211,180,0) 70%);"></div>
  <div style="position:absolute; bottom:-220px; left:120px; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 70%);"></div>

  <div style="position:relative; width:100%; height:100%; display:flex; align-items:center; padding:0 64px; gap:56px;">
    <!-- Lambang rasmi kelab (ic_launcher / splash asset sebenar) -->
    <img src="logo.png" style="width:240px; height:222px; flex-shrink:0; filter:drop-shadow(0 12px 26px rgba(0,0,0,0.28));">

    <div style="display:flex; flex-direction:column;">
      <span style="font-size:19px; font-weight:700; letter-spacing:2.6px; color:#9FD3B4;">MAIWP ACTIVE RECREATION CLUB</span>
      <span class="marc-display" style="font-size:118px; font-weight:600; color:#FAF9F6; line-height:1.05; margin-top:6px;">MARC</span>
      <span style="font-size:28px; line-height:1.4; color:#E4E1DA; margin-top:14px; max-width:600px;">Apl komuniti tidak rasmi: pengumuman, ahli, aktiviti &amp; sumbangan MARC.</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
