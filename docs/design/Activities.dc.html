<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .marc-screen { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; color: #1C1B19; }
    .marc-display { font-family: Fraunces, Georgia, 'Times New Roman', serif; }
    a { color: #2F6B4F; } a:hover { color: #1F3D34; }
  </style>
</helmet>

<div class="marc-screen" style="position:relative; width:1080px; height:1920px; background:#FAF9F6; overflow:hidden;">

  <!-- AppBar -->
  <div style="position:absolute; top:0; left:0; width:1080px; height:140px; display:flex; align-items:center; padding:0 40px;">
    <div class="marc-display" style="font-size:55px; font-weight:600; color:#1C1B19;">Aktiviti</div>
  </div>

  <!-- Segmented control (Akan Datang / Lepas) -->
  <div style="position:absolute; top:150px; left:30px; width:1020px; height:100px; border-radius:25px; background:#EEECE6; padding:10px; display:flex;">
    <div style="flex:1; border-radius:16px; background:#2F6B4F; display:flex; align-items:center; justify-content:center;">
      <span style="font-size:35px; font-weight:600; color:#FFFFFF;">Akan Datang</span>
    </div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <span style="font-size:35px; font-weight:600; color:#6B6B6B;">Lepas</span>
    </div>
  </div>

  <!-- Cip kategori -->
  <div style="position:absolute; top:270px; left:0; width:1080px; height:120px; display:flex; align-items:center; gap:16px; padding:0 30px; overflow:hidden;">
    <div style="padding:14px 30px; border-radius:40px; background:rgba(47,107,79,0.16); white-space:nowrap;">
      <span style="font-size:32px; font-weight:600; color:#1F3D34;">Semua</span>
    </div>
    <div style="padding:14px 30px; border-radius:40px; background:#FFFFFF; border:1.5px solid #C9C6BF; white-space:nowrap;">
      <span style="font-size:32px; color:#1C1B19;">Hiking</span>
    </div>
    <div style="padding:14px 30px; border-radius:40px; background:#FFFFFF; border:1.5px solid #C9C6BF; white-space:nowrap;">
      <span style="font-size:32px; color:#1C1B19;">Badminton</span>
    </div>
    <div style="padding:14px 30px; border-radius:40px; background:#FFFFFF; border:1.5px solid #C9C6BF; white-space:nowrap;">
      <span style="font-size:32px; color:#1C1B19;">Bola Tampar</span>
    </div>
  </div>

  <!-- Activity card 1 -->
  <div style="position:absolute; top:430px; left:30px; width:1020px; padding:35px; background:#FFFFFF; border-radius:30px; box-shadow:0 2px 10px rgba(28,27,25,0.06);">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px;">
      <span style="font-size:40px; font-weight:500; color:#1C1B19; line-height:1.25;">Hiking Bukit Broga</span>
      <svg width="50" height="50" viewBox="0 0 24 24" fill="#2F6B4F" stroke="#2F6B4F" stroke-width="1.2" style="flex-shrink:0; margin-top:6px;"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
    </div>
    <div style="display:flex; align-items:center; gap:15px; margin-top:22px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span style="font-size:37px; color:#6B6B6B;">Sabtu, 6 Sept 2026, 7:00 pagi</span>
    </div>
    <div style="display:flex; align-items:center; gap:15px; margin-top:10px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span style="font-size:37px; color:#6B6B6B;">Bukit Broga, Semenyih</span>
    </div>
    <div style="display:flex; gap:12px; margin-top:20px;">
      <div style="padding:8px 20px; border-radius:50px; background:rgba(107,107,107,0.12);">
        <span style="font-size:30px; color:#6B6B6B;">Hiking</span>
      </div>
      <div style="padding:8px 20px; border-radius:50px; background:rgba(107,107,107,0.12);">
        <span style="font-size:30px; color:#6B6B6B;">18 slot tinggal</span>
      </div>
    </div>
  </div>

  <!-- Activity card 2 -->
  <div style="position:absolute; top:830px; left:30px; width:1020px; padding:35px; background:#FFFFFF; border-radius:30px; box-shadow:0 2px 10px rgba(28,27,25,0.06);">
    <span style="font-size:40px; font-weight:500; color:#1C1B19; line-height:1.25;">Badminton Bulanan</span>
    <div style="display:flex; align-items:center; gap:15px; margin-top:22px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span style="font-size:37px; color:#6B6B6B;">Ahad, 14 Sept 2026, 9:00 pagi</span>
    </div>
    <div style="display:flex; align-items:center; gap:15px; margin-top:10px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span style="font-size:37px; color:#6B6B6B;">Dewan Serbaguna MARC</span>
    </div>
    <div style="display:flex; gap:12px; margin-top:20px;">
      <div style="padding:8px 20px; border-radius:50px; background:rgba(107,107,107,0.12);">
        <span style="font-size:30px; color:#6B6B6B;">Badminton</span>
      </div>
      <div style="padding:8px 20px; border-radius:50px; background:rgba(107,107,107,0.12);">
        <span style="font-size:30px; color:#6B6B6B;">6 pendaftaran</span>
      </div>
    </div>
  </div>

  <!-- Bottom nav (Aktiviti aktif) -->
  <div style="position:absolute; bottom:0; left:0; width:1080px; height:200px; background:#FAF9F6; border-top:1px solid #E4E1DA; display:flex; align-items:center; justify-content:space-around;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      <span style="font-size:26px; color:#6B6B6B;">Utama</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="width:96px; height:56px; border-radius:28px; background:rgba(47,107,79,0.14); display:flex; align-items:center; justify-content:center;">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      </div>
      <span style="font-size:26px; font-weight:600; color:#2F6B4F;">Aktiviti</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span style="font-size:26px; color:#6B6B6B;">Notifikasi</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span style="font-size:26px; color:#6B6B6B;">Profil</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
