name: marc
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.6+6

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  onesignal_flutter: ^5.6.7
  skeletonizer: ^2.1.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  # Dipin ke 12.0.3 (bukan ^13.0.0) - versi 13.x tarik
  # permission_handler_android 14.x yang perlukan compileSdk 37 (Android
  # SDK 37.0/"Android 17", bleeding-edge, folder platform "android-37.0"
  # tak sepadan dgn hash "android-37" yang AGP semasa cari). 12.0.3 guna
  # permission_handler_android ^13.0.0 yang cuma perlukan compileSdk 35.
  permission_handler: 12.0.3
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  flutter_stripe: ^13.1.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  path: ^1.9.1
  extended_image: ^10.1.0
  gal: ^2.3.3
  image: ^4.9.1
  # Rendering QR tulen Dart (CustomPainter) - tiada kod Android/iOS, jadi
  # ia tidak menyentuh siling compileSdk 35 macam permission_handler di
  # atas. Disahkan: `flutter build apk --debug` lulus pada 4.1.0.
  qr_flutter: ^4.1.0
  # Pengimbas QR check-in (skrin pengurusan). Ini SATU-SATUNYA pakej dalam
  # modul aktiviti yang membawa kod Android/iOS asli, jadi ia risiko
  # sebenar terhadap siling compileSdk 35 projek ini (lihat komen
  # permission_handler di atas).
  #
  # Disahkan: 7.4.0 membina pada compileSdk 35 - `flutter build apk --debug`
  # lulus tanpa ralat AGP/compileSdk (hanya amaran KGP yang sama seperti
  # package_info_plus dan stripe_android sudah beri hari ini). Tiada versi
  # lebih lama perlu dicuba.
  #
  # Kalau naik taraf kemudian gagal dengan ralat compileSdk/AGP: kekal di
  # sini. Check-in manual pada skrin Senarai Peserta berfungsi sepenuhnya
  # tanpa pengimbas, jadi menaikkan compileSdk seluruh projek untuk pakej
  # ini bukan pertukaran yang berbaloi.
  mobile_scanner: ^7.4.0
  webview_flutter: ^4.13.0
  # Resit PDF (yuran pendaftaran/aktiviti/donation) kini di-stream TERUS
  # dari backend (bukan URL R2 lagi, 2026-08-24) - `printing` buka
  # dialog preview/simpan/kongsi/cetak native drpd bait PDF terus,
  # elak perlu path_provider+open_filex+share_plus berasingan. Disahkan
  # `flutter build apk --debug` lulus pada compileSdk 35 (lihat nota
  # mobile_scanner/permission_handler di atas utk sebab siling ni
  # penting).
  printing: ^5.14.3
  device_info_plus: ^12.4.0
  # Peta OSM melalui MapLibre native (`maplibre_gl`) + gaya OpenFreeMap
  # (data OSM, tanpa API key). Arrow satu-hala dan `setStyle` ialah
  # sebahagian spesifikasi gaya - bukan workaround Dart. Plugin Android
  # compileSdk 36, sama dengan `flutter.compileSdkVersion` (Flutter 3.44).
  # Elak compileSdk 37 (lihat `permission_handler` di atas).
  latlong2: ^0.10.1
  maplibre_gl: ^0.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  flutter_flavorizr: ^2.6.0
  url_launcher_platform_interface: ^2.3.2

  # Nyahzip GTFS dalam tool/build_transit_assets.dart. Dev sahaja - ia tak
  # pernah masuk APK, dan ia Dart tulen jadi ia tak sentuh siling compileSdk
  # yang dijaga oleh permission_handler di atas.
  archive: ^4.0.9

# App icon (jana: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/splash/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/splash/logo.png"
  min_sdk_android: 21

# Splash screen native (jana: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/full_logo.png
  android_12:
    color: "#FFFFFF"
    # full_logo.png (bbox 1000x854 atas kanvas 1052x1054) penuh sampai
    # tepi macam logo.png lama - Android 12+ splash mask ikon dalam
    # bulatan 768px atas kanvas 1152x1152, jadi tanpa padding tepi/penjuru
    # logo kena potong oleh mask tu. full_logo_android12.png ialah versi
    # berkanvas 1152x1152 dgn logo diskalakan ke ~620px (padanan skala
    # logo_android12.png lama), jadi selamat dalam bulatan safe-zone.
    image: assets/splash/full_logo_android12.png
  android: true
  ios: true
  web: false

# Flavor config (jana semula: dart run flutter_flavorizr -f).
# staging -> .env.staging, prod -> .env.prod (lihat main.dart).
# applicationId/bundle id prod kekal com.hafizbahtiar.marc (elak reset
# listing Play Store/App Store sedia ada); staging dapat suffix .staging
# supaya kedua-dua flavor boleh dipasang serentak pada satu peranti.
flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"

  flavors:
    staging:
      app:
        name: "Marc Staging"
      android:
        applicationId: "com.hafizbahtiar.marc.staging"
      ios:
        bundleId: "com.hafizbahtiar.marc.staging"
    prod:
      app:
        name: "Marc"
      android:
        applicationId: "com.hafizbahtiar.marc"
      ios:
        bundleId: "com.hafizbahtiar.marc"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - .env
    - .env.staging
    - .env.prod
    # Entri direktori Flutter TIDAK rekursif: `- assets/` hanya ambil fail
    # yang terus dalam `assets/` (tiada satu pun), jadi ia no-op. Setiap
    # subdirektori kena disenarai sendiri atau asetnya tak masuk bundle.
    - assets/donation/
    - assets/splash/
    # Laluan/stesen rel Rapid KL, disula dari GTFS data.gov.my oleh
    # `dart run tool/build_transit_assets.dart`. Lihat
    # test/shared/ui/map/docs/TRANSPORTATION.md.
    - assets/transit/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
